{% load static %}<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System Error — ELECTROCART</title>
  <link rel="stylesheet" href="{% static 'dist/css/styles.css' %}">
</head>
<body data-world="neutral">
  <header class="site-header">
    <div class="container header-inner flex items-center justify-between" style="min-height: 72px;">
      <a href="/" class="site-brand">
        <span class="brand-name">ELECTROCART</span>
      </a>
    </div>
  </header>
  <main id="main-content" class="container section">
    <div class="empty-state-card text-center">
      <div class="caption text-muted uppercase tracking-widest mb-2">500 &middot; Server Error</div>
      <h1 class="empty-state-title mb-3">Something went wrong on our side.</h1>
      <p class="empty-state-desc mb-6">
        Something went wrong on our side. Your cart is safe.
      </p>
      <div class="empty-state-actions flex flex-wrap gap-4 justify-center">
        <a href="/" class="btn btn-primary">Back to the shop</a>
        <a href="mailto:support@electrocart.test" class="btn btn-secondary">Contact support</a>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container text-center caption text-muted py-8">
      <p>&copy; {% now "Y" %} ELECTROCART. Demonstrating honest Indian retail engineering.</p>
    </div>
  </footer>
</body>
</html>
