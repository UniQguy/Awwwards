{% extends "base.html" %}

{% block title %}404 Not Found — ELECTROCART{% endblock %}

{% block content %}
<div class="container section">
  <div class="empty-state-card">
    <svg class="empty-state-mark" aria-hidden="true"><use href="#icon-alert"></use></svg>
    <h1 class="empty-state-title">404 — Page Not Found</h1>
    <p class="empty-state-desc">The product, category, or page you were looking for could not be found or has moved.</p>
    <div class="empty-state-actions">
      <a href="{% url 'home' %}" class="btn btn-primary">Return to Homepage</a>
      <a href="{% url 'category_list' %}" class="btn btn-secondary">Browse Categories</a>
    </div>
  </div>
</div>
{% endblock %}
