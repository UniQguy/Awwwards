{% extends "base.html" %}

{% block title %}Page Not Found — ELECTROCART{% endblock %}

{% block content %}
<div class="container section">
  <div class="empty-state-card text-center">
    <div class="caption text-muted uppercase tracking-widest mb-2">404 &middot; Not Found</div>
    <h1 class="empty-state-title mb-3">This object has moved or does not exist.</h1>
    <p class="empty-state-desc mb-6">
      The link you followed may be outdated, or the product has been unlisted from the catalogue.
    </p>
    <div class="empty-state-actions flex gap-4 justify-center">
      <a href="{% url 'home' %}" class="btn btn-primary">Back to the shop</a>
      <button type="button" class="btn btn-secondary" onclick="const input = document.getElementById('search-input'); if (input) { input.focus(); window.scrollTo({top: 0, behavior: 'smooth'}); }">Search the catalogue</button>
    </div>
  </div>
</div>
{% endblock %}
