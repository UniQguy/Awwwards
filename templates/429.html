{% extends "base.html" %}

{% block title %}Too Many Attempts — ELECTROCART{% endblock %}

{% block content %}
<div class="container section">
  <div class="empty-state-card text-center">
    <div class="caption text-muted uppercase tracking-widest mb-2">429 &middot; Rate Limited</div>
    <h1 class="empty-state-title mb-3">Too many attempts in a short time.</h1>
    <p class="empty-state-desc mb-6">
      Too many attempts in a short time. Please wait a minute before retrying.
    </p>
    <div class="empty-state-actions flex flex-wrap gap-4 justify-center">
      <button id="rate-limit-retry" type="button" class="btn btn-secondary" disabled>
        Retry in <span id="countdown">60</span>s
      </button>
      <a href="{% url 'home' %}" class="btn btn-primary">Back to the shop</a>
    </div>
  </div>
</div>
<script>
  (function() {
    let sec = 60;
    const btn = document.getElementById('rate-limit-retry');
    const span = document.getElementById('countdown');
    const timer = setInterval(function() {
      sec -= 1;
      if (span) span.textContent = sec;
      if (sec <= 0) {
        clearInterval(timer);
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Retry now';
          btn.onclick = function() { window.location.reload(); };
        }
      }
    }, 1000);
  })();
</script>
{% endblock %}
