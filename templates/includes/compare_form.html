<form action="{% url 'compare_add' product.id %}" method="post" class="compare-form" data-fetch-enhance>
  {% csrf_token %}
  <button
    type="submit"
    class="btn btn-secondary btn-sm{% if is_card_action %} card-action-btn{% endif %}"
    aria-label="Compare {{ product.display_name }}"
  >
    <svg class="icon icon-xs" aria-hidden="true"><use href="#icon-compare"></use></svg>
    <span class="{% if is_card_action %}sr-only{% endif %}">Compare</span>
  </button>
</form>
