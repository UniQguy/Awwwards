<form action="{% url 'cart_add' product.id %}" method="post" class="add-to-cart-form" data-fetch-enhance>
  {% csrf_token %}
  <input type="hidden" name="quantity" value="1">
  <button
    type="submit"
    class="btn btn-primary btn-sm"
    {% if not product.is_purchasable %}disabled aria-disabled="true"{% endif %}
  >
    {% if product.is_purchasable %}Add to Bag{% else %}Unavailable{% endif %}
  </button>
</form>
