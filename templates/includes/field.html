{% if field %}
  <div class="form-group {% if field.errors %}has-error{% endif %}">
    <label for="{{ field.id_for_label }}" class="form-label">
      <span>{{ field.label }}</span>
      {% if field.field.required %}<span class="form-required" aria-hidden="true">*</span>{% endif %}
    </label>

    {{ field }}

    {% if field.errors %}
      {% for error in field.errors %}
        <p class="form-error" id="error-{{ field.id_for_label }}" role="alert">{{ error }}</p>
      {% endfor %}
    {% endif %}

    {% if field.help_text %}
      <p class="form-help" id="help-{{ field.id_for_label }}">{{ field.help_text }}</p>
    {% endif %}
  </div>
{% endif %}
