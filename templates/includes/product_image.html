{% with media_item=product.media.first %}
  {% if media_item and media_item.url %}
    <img
      class="product-img"
      src="{{ media_item.url }}"
      alt="{{ media_item.alt_text|default:product.display_name }}"
      width="300"
      height="300"
      loading="{% if eager %}eager{% else %}lazy{% endif %}"
      data-category="{{ product.category.name }}"
    >
  {% else %}
    <div class="image-fallback-plate" role="img" aria-label="{{ product.display_name }}">
      <span class="image-fallback-initial">{{ product.display_name|slice:":1" }}</span>
      <span class="image-fallback-text">{{ product.category.name }}</span>
    </div>
  {% endif %}
{% endwith %}
