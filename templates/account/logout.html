{% extends "base.html" %}

{% block title %}Sign Out — ELECTROCART{% endblock %}

{% block content %}
<div class="container section">
  <div class="checkout-card max-w-md mx-auto text-center">
    <h1 class="display-l mb-2">Sign Out</h1>
    <p class="body-sm text-muted mb-6">Are you sure you want to sign out of your account?</p>

    <form method="post" action="{% url 'account_logout' %}">
      {% csrf_token %}
      <div class="flex gap-4 justify-center">
        <button type="submit" class="btn btn-primary">Sign Out</button>
        <a href="{% url 'account_dashboard' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
