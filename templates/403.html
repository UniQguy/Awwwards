{% extends "base.html" %}

{% block title %}Access Restricted — ELECTROCART{% endblock %}

{% block content %}
<div class="container section">
  <div class="empty-state-card text-center">
    <div class="caption text-muted uppercase tracking-widest mb-2">403 &middot; Forbidden</div>
    <h1 class="empty-state-title mb-3">That didn't go through.</h1>
    <p class="empty-state-desc mb-6">
      If your session expired, retry your last action or return to the shop catalogue.
    </p>
    <div class="empty-state-actions flex flex-wrap gap-4 justify-center">
      <a href="{% if retry_url %}{{ retry_url }}{% elif request.META.HTTP_REFERER %}{{ request.META.HTTP_REFERER }}{% else %}{% url 'cart_detail' %}{% endif %}" class="btn btn-primary">
        Retry last action
      </a>
      <a href="{% url 'home' %}" class="btn btn-secondary">
        Back to the shop
      </a>
    </div>
  </div>
</div>
{% endblock %}
