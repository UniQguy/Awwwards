{% extends "base.html" %}

{% block title %}Payment Processing — ELECTROCART{% endblock %}

{% block content %}
<div class="container section">
  <div style="max-width: 600px; margin: 0 auto; text-align: center;">
    <div class="alert alert-info" style="padding: 2rem; margin-bottom: 2rem;">
      <h1>Payment Pending Confirmation</h1>
      <p>Your payment is currently being processed by your bank. We will notify you once confirmation is received.</p>

    <a href="{% url 'order_track_timeline' order_number=order.order_number %}" class="btn btn-primary">Track Order Status</a>
  </div>
</div>
{% endblock %}
