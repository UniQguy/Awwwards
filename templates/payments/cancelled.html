{% extends "base.html" %}

{% block title %}Payment Cancelled — ELECTROCART{% endblock %}

{% block content %}
<div class="container section">
  <div class="max-w-md mx-auto text-center">
    <div class="alert alert-warning p-6 mb-6">
      <h1 class="display-l mb-2">Payment Cancelled</h1>
      <p class="body-sm">The transaction was cancelled before completion. Order #{{ order.order_number }} remains in pending state.</p>
    </div>

    <a href="{% url 'payments:razorpay_checkout' order_number=order.order_number %}" class="btn btn-primary">Resume Payment</a>
  </div>
</div>
{% endblock %}
